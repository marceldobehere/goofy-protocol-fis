name: Deploy static Frontend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        working-directory: goofy-protocol-fis-fe
        run: |
          if [ -f "${{ github.workspace }}/goofy-protocol-fis-fe/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/goofy-protocol-fis-fe/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            goofy-protocol-fis-fe/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('goofy-protocol-fis-fe/package-lock.json', 'goofy-protocol-fis-fe/yarn.lock') }}-${{ hashFiles('goofy-protocol-fis-fe/**.[jt]s', 'goofy-protocol-fis-fe/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('goofy-protocol-fis-fe/package-lock.json', 'goofy-protocol-fis-fe/yarn.lock') }}-

      - name: Install dependencies
        working-directory: goofy-protocol-fis-fe
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        working-directory: goofy-protocol-fis-fe
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: goofy-protocol-fis-fe/out
